<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body{font-family:system-ui;background:#F5F7FB;margin:0;padding:32px;}
  .row{display:flex;align-items:center;gap:24px;margin-bottom:28px;}
  .card{background:#fff;border:1px solid #E2E8F0;border-radius:16px;padding:20px 24px;}
  .dark{background:#0B1728;border-color:#1c378c;}
  .lbl{font-size:12px;color:#64748b;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;font-weight:700;}
  .dark .lbl{color:#94a3b8;}
  .ic{width:64px;height:64px;}
</style></head><body>
  <div class="row">
    <div class="card">
      <div class="lbl">Mark (64)</div>
      <img class="ic" src="logo-mark.svg" alt="">
    </div>
    <div class="card dark">
      <div class="lbl">Mark on dark</div>
      <img class="ic" src="logo-mark.svg" alt="">
    </div>
    <div class="card">
      <div class="lbl">Favicon</div>
      <img class="ic" src="favicon.svg" alt="">
    </div>
  </div>
  <div class="row">
    <div class="card">
      <div class="lbl">Horizontal (light)</div>
      <img src="logo.svg" style="height:56px" alt="">
    </div>
  </div>
  <div class="row">
    <div class="card dark">
      <div class="lbl">Horizontal (dark)</div>
      <img src="logo-white.svg" style="height:56px" alt="">
    </div>
  </div>
  <div class="row">
    <div class="card"><div class="lbl">Social 512</div><img src="logo-square.svg" style="width:96px;height:96px"></div>
    <div class="card"><div class="lbl">Small 32</div><img src="logo-mark.svg" style="width:32px;height:32px"></div>
    <div class="card"><div class="lbl">Small 20</div><img src="logo-mark.svg" style="width:20px;height:20px"></div>
  </div>
</body></html>
